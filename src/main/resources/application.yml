spring:
  application:
    name: collateral-management-system

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/collateral_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ✅ AJOUTÉ - Configuration Hikari pour éviter les déconnexions
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000        # 5 minutes
      max-lifetime: 600000         # 10 minutes
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # ✅ AJOUTÉ - Pour maintenir la connexion active
        jdbc:
          time_zone: UTC
        connection:
          provider_disables_autocommit: false

  security:
    jwt:
      # Updated secret key - must be at least 512 bits (64 characters) for HS512
      secret: VermegCollateralManagementSecretKey2024ForJWTAuthenticationSystemSecure512BitsMinimumLength
      expiration: 86400000

server:
  port: 8080
  #servlet:
  #context-path: /api

logging:
  level:
    com.vermeg.collateralmanagement: DEBUG
    com.vermeg.collateralmanagement.service.AlertService: INFO
    com.vermeg.collateralmanagement.scheduler.AlertScheduledTasks: INFO
    com.vermeg.collateralmanagement.controller.AlertController: INFO
    com.zaxxer.hikari: WARN  # ✅ AJOUTÉ - Pour voir les warnings Hikari

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Alert System Configuration
collateral:
  alerts:
    # Risk thresholds
    critical-risk-threshold: 0.9
    high-risk-threshold: 0.75
    medium-risk-threshold: 0.5

    # Concentration limits (as decimal, e.g., 0.25 = 25%)
    max-asset-concentration: 0.25
    warning-asset-concentration: 0.20

    # Valuation settings
    stale-valuation-days: 3
    critical-valuation-days: 7

    # Maturity warnings
    maturity-warning-days: 30
    critical-maturity-days: 7

    # System settings
    duplicate-alert-minutes: 60
    cleanup-days: 90
    enable-email-notifications: true
    enable-system-wide-alerts: true

    # Volatility thresholds
    critical-volatility: 0.25
    high-volatility: 0.15
    medium-volatility: 0.10

    # Performance settings
    batch-size: 100
    max-alerts-per-user: 1000
    enable-bulk-operations: true

    # Scheduling configuration
    scheduling:
      enabled: true