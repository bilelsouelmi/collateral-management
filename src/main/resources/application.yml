spring:
  application:
    name: collateral-management-system

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/collateral_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    jwt:
      # Updated secret key - must be at least 512 bits (64 characters) for HS512
      secret: VermegCollateralManagementSecretKey2024ForJWTAuthenticationSystemSecure512BitsMinimumLength
      expiration: 86400000

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.vermeg.collateralmanagement: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html